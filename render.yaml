services:
  - type: web
    name: andreas-ahop
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGO_DB_NAME
        value: vesta_fashion
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: vesta
      - key: ADMIN_PASSWORD
        value: "4"
      - key: STORE_NAME
        value: VESTA
      - key: APP_BASE_URL
        value: https://andreas-ahop.onrender.com
      - key: CURRENCY
        value: mxn
      - key: COOKIE_SECURE
        value: "true"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
