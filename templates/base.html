<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f4ef">
  <title>{% block title %}{{ store_name }} — Moda para cada día{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='dark-mode.css') }}">
  <script>try { document.documentElement.dataset.theme = localStorage.getItem('vesta-theme') || 'light'; } catch (_) { document.documentElement.dataset.theme = 'light'; }</script>
</head>
<body>
  {% block content %}{% endblock %}
  <footer class="site-footer">
    <a class="brand brand-footer" href="{{ url_for('index') }}">{{ store_name }}<span>.</span></a>
    <p>Estilo que se siente como tú.</p>
    <nav class="footer-links" aria-label="Cuenta y administración">
      <a href="{{ url_for('customer_dashboard') if customer_signed_in else url_for('customer_login') }}">Mi cuenta</a>
      <a href="{{ url_for('admin_dashboard') if admin_signed_in else url_for('admin_login') }}">Administración</a>
    </nav>
    <span class="copyright">© {{ 2026 }} {{ store_name }}. Tienda de demostración.</span>
  </footer>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Activar modo oscuro" aria-pressed="false" title="Cambiar tema">
    <span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Modo oscuro</span>
  </button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>window.VESTA_CONFIG = {currency: {{ currency|tojson }}, stripeEnabled: {{ stripe_enabled|tojson }}};</script>
  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
